<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <h2>🌾 Smart Farmer</h2>

        <div>

            <a href="/">
                Home
            </a>

            <a href="/login">
                Farmer Login
            </a>

        </div>

    </nav>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="message {{ category }}">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <div class="form-container">

        <h1>👨‍💼 Staff Login</h1>

        <p>
            Login to manage farmer procurement.
        </p>


        <form
            method="POST"
            action="{{ url_for('admin_login') }}">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>


            <button type="submit">
                Staff Login
            </button>

        </form>

    </div>

</body>

</html>
